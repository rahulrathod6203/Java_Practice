spring:
  application:
    name: unit-testing
  datasource:
    url: jdbc:postgresql://localhost:5432/UNIT_TESTING
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

